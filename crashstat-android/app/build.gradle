plugins {
    id 'com.android.application'
}

android {
    namespace 'com.crashstat.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.crashstat.mobile'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
