name: Build CrashStat APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CrashStat Auto AI APK
        id: android_build
        continue-on-error: true
        run: gradle -p crashstat-android assembleDebug --console=plain --stacktrace > build-output.log 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrashStat-v4-build-log
          path: build-output.log
          if-no-files-found: error
          retention-days: 7

      - name: Rename APK
        if: steps.android_build.outcome == 'success'
        run: cp crashstat-android/app/build/outputs/apk/debug/app-debug.apk CrashStat-Auto-AI-v4.apk

      - name: Upload APK
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CrashStat-Auto-AI-v4-APK
          path: CrashStat-Auto-AI-v4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report build failure
        if: steps.android_build.outcome == 'failure'
        run: |
          tail -n 120 build-output.log
          exit 1
