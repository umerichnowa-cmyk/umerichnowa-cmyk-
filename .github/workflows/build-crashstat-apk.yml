name: Build CrashStat APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CrashStat AI Trainer APK
        run: gradle -p crashstat-android assembleDebug --stacktrace

      - name: Rename APK
        run: cp crashstat-android/app/build/outputs/apk/debug/app-debug.apk CrashStat-AI-Trainer-v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrashStat-AI-Trainer-v3-APK
          path: CrashStat-AI-Trainer-v3.apk
          if-no-files-found: error
          retention-days: 30
